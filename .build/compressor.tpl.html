<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="third-party-notices" content="内嵌 MP3 编码器 lamejs 1.2.1（LGPL-3.0，作者 Alex Zhukov，源码 https://github.com/zhuker/lamejs）；完整声明见仓库 THIRD-PARTY-NOTICES.md">
<title>MP3 压缩器 · 离线单文件</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#F2F7FD;background-image:radial-gradient(80% 40% at 50% 0,#FFFFFF,rgba(255,255,255,0) 70%);color:#22345C;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;font-size:14px;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:22px 16px 60px}
h1{font-size:21px;font-weight:900;margin:0 0 4px;color:#2F6BE0}
.sub{color:#6B7FA8;margin:0 0 18px}
.sec{background:#fff;border:1px solid #DFE9F6;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 6px 18px rgba(80,110,160,.08)}
h2{font-size:13px;font-weight:800;color:#3E63A8;margin:0 0 12px}
h2 b{display:inline-block;min-width:20px;height:20px;line-height:20px;text-align:center;border-radius:6px;background:#E8F1FE;color:#2F6BE0;margin-right:8px;font-size:12px}
.drop{border:2px dashed #B9CEE8;border-radius:14px;padding:26px 16px;text-align:center;color:#6B7FA8;cursor:pointer;background:#F8FBFF;transition:background .15s,border-color .15s}
.drop.hot{border-color:#2F6BE0;background:#EEF5FF}
.drop strong{color:#2F6BE0}
.drop input{display:none}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-top:14px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:11px;color:#6B7FA8;font-weight:700}
.fld select{background:#fff;border:1px solid #CBD9EC;border-radius:9px;padding:7px 10px;font-size:13px;font-family:inherit;color:#22345C}
.acts{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.btn{background:linear-gradient(160deg,#69B0F2,#2F6BE0);border:0;color:#fff;font-weight:800;border-radius:11px;padding:11px 20px;font-size:14px;cursor:pointer;font-family:inherit;box-shadow:0 6px 16px rgba(47,107,224,.3)}
.btn:disabled{background:#C9D6E8;box-shadow:none;cursor:not-allowed}
.btn.ghost{background:#fff;border:2px solid #D6E8FC;color:#2F6BE0;box-shadow:none;font-weight:700}
.item{border:1px solid #E4EEF9;border-radius:12px;padding:11px 13px;margin-bottom:8px;background:#F9FCFF}
.item .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.item .nm{font-weight:800;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 160px}
.item .st{font-size:11px;color:#8CA0C0;white-space:nowrap}
.item .bar{height:8px;border-radius:5px;background:#E8F1FE;overflow:hidden;margin:8px 0 6px}
.item .bar span{display:block;height:100%;width:0;background:linear-gradient(90deg,#69B0F2,#2F6BE0);transition:width .2s}
.item .res{font-size:12px;color:#2C7A44;font-weight:700}
.item .res.bad{color:#C0395E}
.item .ok{font-size:11px;color:#8CA0C0}
.item a{font-size:12px;font-weight:800;color:#2F6BE0}
.hint{font-size:11px;color:#8CA0C0;margin:8px 0 0}
.sum{font-size:13px;font-weight:700;color:#22345C}
.sum b{color:#2F6BE0}
#err{display:none;position:fixed;left:10px;right:10px;bottom:10px;z-index:99;background:#FFF1F4;border:1px solid #FF8FB0;border-radius:10px;padding:10px 12px;font-size:12px;color:#8E2448}
</style>
</head>
<body>
<div class="wrap">
  <h1>MP3 压缩器</h1>
  <p class="sub">单个 HTML 文件，完全离线。拖进 mp3 → 选码率 → 下载压好的 mp3。编码器（lamejs，152 KB）已内嵌在这个文件里。</p>

  <div id="err"></div>

  <section class="sec">
    <h2><b>1</b>选文件</h2>
    <label class="drop" id="drop">
      <input type="file" id="files" accept="audio/*" multiple>
      <div id="dropTxt"><strong>点这里选 MP3</strong>，或把文件拖进这个框<br><span class="hint">可一次选多个；也能选 m4a / wav，浏览器能解码就行</span></div>
    </label>
    <div class="opts">
      <label class="fld"><span>目标码率</span>
        <select id="kbps">
          <option value="32">32 kbps（最小）</option>
          <option value="48">48 kbps</option>
          <option value="64" selected>64 kbps（推荐，约 5:1）</option>
          <option value="96">96 kbps（音乐留细节）</option>
          <option value="128">128 kbps</option>
          <option value="192">192 kbps</option>
        </select>
      </label>
      <label class="fld"><span>声道</span>
        <select id="ch">
          <option value="1" selected>单声道（体积减半，人声足够）</option>
          <option value="2">保持立体声</option>
        </select>
      </label>
      <label class="fld"><span>采样率</span>
        <select id="rate">
          <option value="0" selected>保持原样</option>
          <option value="32000">降到 32 kHz</option>
          <option value="22050">降到 22.05 kHz（更省）</option>
        </select>
      </label>
    </div>
    <div class="acts">
      <button type="button" class="btn" id="go" disabled>开始压缩</button>
      <button type="button" class="btn ghost" id="clear">清空列表</button>
      <span class="sum" id="sum"></span>
    </div>
    <p class="hint">同一个文件重复压缩不会更好；想再小就降码率或改单声道。压完的文件直接在列表里下载。</p>
  </section>

  <section class="sec">
    <h2><b>2</b>结果</h2>
    <div id="list"><p class="hint" style="margin:0">还没有文件。</p></div>
  </section>
</div>

<script>{{LAME_JS}}</script>
<script>
(function(){
'use strict';
var errBox = document.getElementById('err');
function showErr(m){ errBox.style.display='block'; errBox.textContent = String(m); }
window.onerror = function(m, s, l){ showErr('脚本错误：' + m + '（第' + l + ' 行）'); return false; };

var picked = [];
var dropEl = document.getElementById('drop');
var filesEl = document.getElementById('files');
var goEl = document.getElementById('go');

function mb(n){ return (n/1048576).toFixed(2) + ' MB'; }
function kb(n){ return n < 1048576 ? (n/1024).toFixed(0) + ' KB' : mb(n); }

function refresh(){
  var txt = document.getElementById('dropTxt');
  if (picked.length) {
    txt.innerHTML = '<strong>已选 ' + picked.length + ' 个文件</strong>，合计 ' + mb(picked.reduce(function(a,f){return a+f.size;},0)) + '<br><span class="hint">再点一下可以追加更多</span>';
  }
  goEl.disabled = picked.length === 0;
  goEl.textContent = picked.length ? ('开始压缩（' + picked.length + ' 个）') : '开始压缩';
}
function addFiles(fl){
  for (var i = 0; i < fl.length; i++) {
    var f = fl[i];
    var dup = false;
    for (var k = 0; k < picked.length; k++) { if (picked[k].name === f.name && picked[k].size === f.size) { dup = true; } }
    if (!dup) { picked.push(f); }
  }
  refresh();
}
dropEl.addEventListener('dragover', function(e){ e.preventDefault(); dropEl.className = 'drop hot'; });
dropEl.addEventListener('dragleave', function(){ dropEl.className = 'drop'; });
dropEl.addEventListener('drop', function(e){ e.preventDefault(); dropEl.className = 'drop'; if (e.dataTransfer && e.dataTransfer.files) { addFiles(e.dataTransfer.files); } });
filesEl.addEventListener('change', function(){ if (filesEl.files) { addFiles(filesEl.files); } filesEl.value = ''; });
document.getElementById('clear').onclick = function(){
  picked = [];
  document.getElementById('list').innerHTML = '<p class="hint" style="margin:0">还没有文件。</p>';
  document.getElementById('sum').textContent = '';
  refresh();
};

function toI16(f){
  var o = new Int16Array(f.length);
  for (var i = 0; i < f.length; i++) {
    var v = f[i];
    if (v > 1) { v = 1; } else if (v < -1) { v = -1; }
    o[i] = v < 0 ? v * 0x8000 : v * 0x7FFF;
  }
  return o;
}
function yieldUI(){ return new Promise(function(r){ setTimeout(r, 0); }); }

async function decodeFile(file){
  var ab = await file.arrayBuffer();
  var AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) { throw new Error('这个浏览器不支持 Web Audio，无法解码'); }
  var ac = new AC();
  try {
    return await ac.decodeAudioData(ab);
  } finally {
    try { ac.close(); } catch(e){}
  }
}
async function maybeResample(audio, ch, targetRate){
  if (!targetRate || targetRate >= audio.sampleRate) { return audio; }
  var frames = Math.max(1, Math.ceil(audio.duration * targetRate));
  var OC = window.OfflineAudioContext || window.webkitOfflineAudioContext;
  if (!OC) { return audio; }
  var oc = new OC(ch, frames, targetRate);
  var src = oc.createBufferSource();
  src.buffer = audio;
  src.connect(oc.destination);
  src.start();
  return await oc.startRendering();
}

async function compressOne(file, onProg){
  var kbps = parseInt(document.getElementById('kbps').value, 10);
  var wantCh = parseInt(document.getElementById('ch').value, 10);
  var wantRate = parseInt(document.getElementById('rate').value, 10);

  var audio = await decodeFile(file);
  var ch = Math.min(wantCh, audio.numberOfChannels);
  audio = await maybeResample(audio, ch, wantRate);
  var rate = audio.sampleRate;

  var L = toI16(audio.getChannelData(0));
  var R = ch > 1 ? toI16(audio.getChannelData(1)) : null;

  var enc = new lamejs.Mp3Encoder(ch, rate, kbps);
  var parts = [];
  var BLK = 1152;
  var total = L.length;
  for (var i = 0; i < total; i += BLK) {
    var l = L.subarray(i, Math.min(i + BLK, total));
    var buf;
    if (ch > 1) {
      var r = R.subarray(i, Math.min(i + BLK, total));
      buf = enc.encodeBuffer(l, r);
    } else {
      buf = enc.encodeBuffer(l);
    }
    if (buf && buf.length) { parts.push(new Int8Array(buf)); }
    if (((i / BLK) % 120) === 0) {
      onProg(i / total);
      await yieldUI();
    }
  }
  var end = enc.flush();
  if (end && end.length) { parts.push(new Int8Array(end)); }
  onProg(1);
  return { blob: new Blob(parts, { type: 'audio/mpeg' }), ch: ch, rate: rate, kbps: kbps, dur: audio.duration };
}

function itemEl(file){
  var d = document.createElement('div');
  d.className = 'item';
  d.innerHTML = '<div class="top"><span class="nm"></span><span class="st"></span></div>'
    + '<div class="bar"><span></span></div><div class="res">等待中…</div>';
  d.querySelector('.nm').textContent = file.name;
  d.querySelector('.st').textContent = kb(file.size);
  document.getElementById('list').appendChild(d);
  return d;
}
function outName(name, kbps, ch){
  return name.replace(/\.[^.]+$/, '') + '_' + kbps + 'k' + (ch === 1 ? '_mono' : '') + '.mp3';
}

goEl.onclick = async function(){
  goEl.disabled = true;
  var kbps = document.getElementById('kbps').value;
  var list = document.getElementById('list');
  if (list.querySelector('.hint')) { list.innerHTML = ''; }
  var before = 0, after = 0;
  try {
    for (var i = 0; i < picked.length; i++) {
      var f = picked[i];
      var d = itemEl(f);
      var bar = d.querySelector('.bar span');
      var res = d.querySelector('.res');
      res.textContent = '解码中…';
      try {
        var out = await compressOne(f, function(p){ bar.style.width = (p * 100).toFixed(1) + '%'; });
        before += f.size; after += out.blob.size;
        var url = URL.createObjectURL(out.blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = outName(f.name, out.kbps, out.ch);
        a.textContent = '下载 ' + a.download;
        res.className = 'res';
        res.innerHTML = '';
        res.appendChild(document.createTextNode(kb(f.size) + ' → ' + kb(out.blob.size)
          + '　压缩比 ' + (f.size / out.blob.size).toFixed(2) + ':1　'
          + out.kbps + 'kbps / ' + out.ch + '声道 / ' + out.rate + 'Hz / ' + out.dur.toFixed(1) + '秒　'));
        res.appendChild(a);
        d.querySelector('.ok');
      } catch (e) {
        res.className = 'res bad';
        res.textContent = '失败：' + ((e && e.message) ? e.message : e) + '（这个文件浏览器解不开）';
        bar.style.width = '100%';
      }
    }
    document.getElementById('sum').textContent = before
      ? ('合计 ' + kb(before) + ' → ' + kb(after) + '，省了 ' + (100 - after / before * 100).toFixed(0) + '%')
      : '';
  } catch (e) {
    showErr('压缩失败：' + ((e && e.message) ? e.message : e));
  }
  goEl.disabled = false;
};

if (typeof lamejs === 'undefined' || !lamejs.Mp3Encoder) {
  showErr('编码器没加载成功——这个文件可能被改坏了。');
  goEl.disabled = true;
}
refresh();
})();
</script>
</body>
</html>
